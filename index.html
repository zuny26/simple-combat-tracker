<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&amp;D Simple Combat Tracker</title>
  <script>
    // Set the theme before first paint to avoid a light/dark flash.
    (function () {
      try {
        var t = localStorage.getItem('dnd-ct-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <div class="app-card">
      <header class="topbar">
        <h1 class="app-title">Combat Tracker</h1>
        <div class="controls">
          <div class="theme-picker" role="group" aria-label="Theme">
            <button type="button" id="theme-day-btn" class="theme-opt">Day</button>
            <button type="button" id="theme-night-btn" class="theme-opt">Night</button>
          </div>
          <div class="round" role="status" aria-live="polite">Round <span id="round-value">0</span></div>
          <button type="button" id="start-next-btn" class="btn btn-primary">Start</button>
          <button type="button" id="reset-btn" class="btn btn-secondary">New Combat</button>
        </div>
      </header>

      <main class="page">
        <table class="combat-table">
          <thead>
            <tr>
              <th class="col-init" title="Initiative">Initiative</th>
              <th class="col-name">Name</th>
              <th class="col-ac">AC</th>
              <th class="col-hpnum">Max HP</th>
              <th class="col-hpnum">Temp HP</th>
              <th class="col-current">Current HP</th>
              <th class="col-hpnum">Dmg</th>
              <th class="col-hpnum">Heal</th>
              <th class="col-text">Conditions</th>
              <th class="col-actions"><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="creature-rows"></tbody>
        </table>
        <button type="button" id="add-btn" class="btn btn-add">+ Add creature</button>
      </main>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
