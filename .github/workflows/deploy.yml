name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact from the successful CI run
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/verified-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      # deploy-pages reads artifacts from its own run. Transfer the unchanged
      # Pages archive from CI; never check out, extract, or rebuild the app here.
      - name: Transfer verified Pages archive to this run
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/verified-pages/artifact.tar
          if-no-files-found: error
          retention-days: 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
